# Starship prompt — Tokyo Night palette, agnoster-inspired Powerline style
# Requires a Nerd Font (Ghostty is configured for "NotoMono Nerd Font").
# Color values live in the [palettes.tokyonight] block below; format strings
# reference them by name. Regenerate that block with theme/regenerate.sh.

add_newline = false
command_timeout = 500
palette = "tokyonight"

format = """\
${custom.os_ok}${custom.os_err}\
$directory\
${custom.dir_close}\
$git_branch\
$git_status\
$nodejs$python$golang$rust$java\
$cmd_duration\
$character"""

# >>> palette (generated from theme/palette.sh — do not edit) >>>
[palettes.tokyonight]
bg = "#1a1b26"
bg_dark = "#16161e"
bg_highlight = "#292e42"
fg = "#c0caf5"
fg_dark = "#a9b1d6"
comment = "#565f89"
red = "#f7768e"
orange = "#ff9e64"
yellow = "#e0af68"
green = "#9ece6a"
teal = "#1abc9c"
cyan = "#7dcfff"
blue = "#7aa2f7"
blue0 = "#3d59a1"
magenta = "#bb9af7"
purple = "#9d7cd8"
# <<< palette <<<

# ─── OS icon (leftmost segment) ────────────────────────────────────────
[custom.os_ok]
when = '[ "${STARSHIP_CMD_STATUS:-0}" = "0" ]'
shell = ["sh"]
command = '''
case "$(uname -s)" in
  Darwin) ICON=$(printf "\357\214\202") ;;
  Linux)
    if [ -r /etc/os-release ] && grep -qi "^id=ubuntu" /etc/os-release; then
      ICON=$(printf "\357\214\233")
    else
      ICON=$(printf "\357\205\274")
    fi ;;
esac
printf "%s" "$ICON"
'''
format = "[ $output ](bg:magenta fg:bg)[](fg:magenta bg:cyan)"

[custom.os_err]
when = '[ "${STARSHIP_CMD_STATUS:-0}" != "0" ]'
shell = ["sh"]
command = '''
case "$(uname -s)" in
  Darwin) ICON=$(printf "\357\214\202") ;;
  Linux)
    if [ -r /etc/os-release ] && grep -qi "^id=ubuntu" /etc/os-release; then
      ICON=$(printf "\357\214\233")
    else
      ICON=$(printf "\357\205\274")
    fi ;;
esac
printf "%s" "$ICON"
'''
format = "[ $output ](bg:red fg:bg)[](fg:red bg:cyan)"

# ─── Current directory ─────────────────────────────────────────────────
[directory]
format = "[ $path ](bg:cyan fg:bg)"
truncation_length = 0
truncate_to_repo = false
truncation_symbol = ""
home_symbol = "~"
read_only = "  "

# ─── Directory close (only when not in a git repo) ────────────────────
# Inside a repo the cyan→blue0 opener of [git_branch] closes the
# directory segment. Outside a repo there's no next segment, so emit
# the powerline terminator explicitly. Octal escapes encode U+E0B0
# () because starship's custom module requires a non-empty command
# stdout to render, and dash's printf doesn't understand \uXXXX.
[custom.dir_close]
shell = ["sh"]
when = "! git rev-parse --is-inside-work-tree >/dev/null 2>&1"
command = 'printf "\356\202\260"'
format = "[$output](fg:cyan)"

# ─── Git branch + status ───────────────────────────────────────────────
[git_branch]
symbol = ""
format = "[](fg:cyan bg:blue0)[ $symbol $branch ](bg:blue0 fg:fg)"

[git_status]
format = "[$all_status$ahead_behind](bg:blue0 fg:fg)[](fg:blue0)"
modified   = "${count}● "
staged     = "${count}+ "
untracked  = "${count}? "
ahead      = "⇡${count} "
behind     = "⇣${count} "
diverged   = "⇕${count} "
conflicted = "!${count} "
deleted    = "${count}✖ "
renamed    = "${count}» "
stashed    = "${count}* "

# ─── Runtime versions (only when project files present) ────────────────
[nodejs]
format = "[  $symbol $version ](fg:green)"
symbol = ""
detect_files = ["package.json", ".nvmrc", ".node-version"]

[python]
format = "[  $symbol $version ](fg:yellow)"
symbol = ""
detect_extensions = ["py"]
detect_files = ["pyproject.toml", "requirements.txt", ".python-version", "Pipfile"]

[golang]
format = "[  $symbol $version ](fg:cyan)"
symbol = ""
detect_files = ["go.mod", "go.sum"]

[rust]
format = "[  $symbol $version ](fg:red)"
symbol = ""
detect_files = ["Cargo.toml"]

[java]
format = "[  $symbol $version ](fg:orange)"
symbol = ""
detect_files = ["pom.xml", "build.gradle", "build.gradle.kts", "deps.edn"]

# ─── Command duration ──────────────────────────────────────────────────
[cmd_duration]
format = "[ took $duration ](fg:orange)"
min_time = 2000

# ─── Prompt character (vi-mode aware) ──────────────────────────────────
[character]
success_symbol = ""
error_symbol   = ""
vimcmd_symbol  = "[❮](bold cyan)"
